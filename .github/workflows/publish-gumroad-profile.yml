name: Publish Gumroad profile landing page

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the live Gumroad profile (replaces the entire profile page)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: gumroad-profile-publish
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Install Gumroad CLI
        run: go install github.com/antiwork/gumroad-cli/cmd/gumroad@latest
      - name: Preview Gumroad sanitization
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          if [ -z "$GUMROAD_ACCESS_TOKEN" ]; then
            echo "::error::Add GUMROAD_ACCESS_TOKEN as a repository Actions secret before running this workflow."
            exit 1
          fi
          "$(go env GOPATH)/bin/gumroad" pages preview landing.html
      - name: Publish profile page
        if: ${{ inputs.publish }}
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: "$(go env GOPATH)/bin/gumroad" pages push profile landing.html
